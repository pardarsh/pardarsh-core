name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rustup reads rust-toolchain.toml (channel and components) on first use.
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --lib --examples --no-default-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
      - run: cargo test --no-default-features --lib
      - run: cargo run --example legislative_change

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    env:
      # Overrides rust-toolchain.toml; must match `rust-version` in Cargo.toml.
      RUSTUP_TOOLCHAIN: 1.85.0
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.85.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  pre-commit:
    name: pre-commit (file hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      # Cargo hooks already run in the jobs above.
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: cargo-fmt,cargo-clippy,cargo-test,cargo-deny
