# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Fail on any RustSec vulnerability; also flag unmaintained crates and yanked versions.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with distributing this Apache-2.0 crate.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The crate must never pull in an application (see ADR 0001).
deny = [{ name = "loklekha" }]
skip = [
    { name = "syn", reason = "Different major versions are required by Windows platform dependencies and proc-macro dependencies." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
